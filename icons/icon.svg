<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Clipboard Outer Frame -->
  <rect x="96" y="112" width="320" height="340" rx="24" fill="#1e293b" stroke="url(#iconGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Clipboard Top Clip -->
  <rect x="186" y="80" width="140" height="50" rx="12" fill="url(#iconGrad)" />
  <circle cx="256" cy="105" r="10" fill="#0f172a" />

  <!-- Checklist Lines & Checkmarks -->
  <!-- Checkmark 1 -->
  <path d="M140 180 l20 20 l40 -40" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="220" y="180" width="150" height="14" rx="7" fill="#f8fafc" />

  <!-- Checkmark 2 -->
  <path d="M140 260 l20 20 l40 -40" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="220" y="260" width="130" height="14" rx="7" fill="#f8fafc" />

  <!-- Checkmark 3 -->
  <path d="M140 340 l20 20 l40 -40" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="220" y="340" width="160" height="14" rx="7" fill="#94a3b8" />
</svg>
