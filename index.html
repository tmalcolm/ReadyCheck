<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description"
    content="Offline-first Progressive Web App for creating, managing, and sharing checklists via Bluetooth and JSON files.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ReadyCheck</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- ==========================================================================
       Splash Screen
       ========================================================================== -->
  <div id="splash-screen">
    <div class="splash-content">
      <svg class="splash-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
        </path>
      </svg>
      <h1 class="splash-title">ReadyCheck</h1>
      <p class="splash-subtitle">Bluetooth-enabled & Offline Storage</p>
      <div class="splash-loader"></div>
    </div>
  </div>

  <!-- ==========================================================================
       Main Application Shell
       ========================================================================== -->
  <div id="app">
    <!-- Navigation Header -->
    <header class="app-header">
      <div class="header-brand">
        <svg class="header-logo" fill="none" stroke="var(--accent-cyan)" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
          </path>
        </svg>
        <span class="header-title">ReadyCheck</span>
      </div>
      <div class="header-actions">
        <!-- Network Status Badge -->
        <span id="network-status-badge" class="auto-save-badge" style="opacity: 1;" title="Network Connection Status">
          <span class="auto-save-dot" id="network-status-dot"></span> <span id="network-status-text">Online</span>
        </span>
        <!-- Theme Toggle -->
        <button id="btn-theme-toggle" class="btn-icon" title="Toggle Light/Dark Theme">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- ==========================================================================
         Screen 1: Main Screen (List All Saved Checklists)
         ========================================================================== -->
    <main id="screen-main" class="screen active">
      <div class="main-toolbar">
        <div class="search-box">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="search-input" placeholder="Search saved checklists..." aria-label="Search checklists">
        </div>
        <div class="toolbar-buttons">
          <button id="btn-new-checklist" class="btn btn-primary">+ New Checklist</button>
          <button id="btn-import-checklist" class="btn btn-secondary">📥 Import Checklist</button>
          <button id="btn-restore-presets" class="btn btn-secondary" title="Restore default preloaded checklists">📚 Defaults</button>
          <a href="help.html" id="btn-help" class="btn btn-secondary" title="Help & User Guide">❓ Help</a>
          <input type="file" id="file-import-input" accept=".json" style="display: none;">
        </div>
      </div>

      <!-- Alphabetically Sorted Checklists Container -->
      <div id="checklist-list" class="checklist-list">
        <!-- Dynamically rendered -->
      </div>

      <!-- Main Page Footer -->
      <footer class="main-footer">
        <div class="footer-text">
          <p class="footer-line1">cali time studio</p>
          <p class="footer-line2">by Tim Malcolm &copy; 2026</p>
        </div>
      </footer>
    </main>

    <!-- ==========================================================================
         Screen 2: Viewing Screen (Interactive Check Off Mode)
         ========================================================================== -->
    <section id="screen-view" class="screen">
      <div class="view-header-bar">
        <button id="btn-back-main" class="btn btn-secondary">← Back</button>
        <div class="card-actions">
          <!-- Export Icon Button -->
          <button id="btn-view-share" class="btn-icon btn-share" title="Export">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 15V3m0 0L8 7m4-4l4 4">
              </path>
            </svg>
          </button>
          <button id="btn-view-print" class="btn btn-secondary" title="Print Checklist">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
              </path>
            </svg>
            Print
          </button>
          <button id="btn-view-copy" class="btn btn-secondary" title="Copy Checklist">Copy</button>
          <button id="btn-view-edit" class="btn btn-secondary">Edit</button>
          <button id="btn-view-reset" class="btn btn-secondary" title="Uncheck all items">Reset</button>
        </div>
      </div>

      <div class="view-title-container">
        <h2 id="view-title" class="view-checklist-title">Checklist Title</h2>
        <span id="auto-save-badge" class="auto-save-badge">
          <span class="auto-save-dot"></span> Saved
        </span>
      </div>

      <div class="progress-bar-container" style="height: 10px;">
        <div id="view-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="view-progress-text" class="progress-text" style="font-size: 0.9rem;">0 of 0 completed (0%)</div>

      <!-- Sublists & Items View -->
      <div id="view-sublists-container" style="margin-top: 0.5rem;">
        <!-- Dynamically rendered -->
      </div>
    </section>

    <!-- ==========================================================================
         Screen 3: Editing Screen (Add, Edit, Delete, Reorder, Title, Sublists)
         ========================================================================== -->
    <section id="screen-edit" class="screen">
      <div class="edit-header-bar">
        <label for="edit-title-input"
          style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">CHECKLIST TITLE</label>
        <input type="text" id="edit-title-input" class="edit-title-input" placeholder="Checklist Title">
      </div>

      <div id="edit-sublists-container" style="margin-top: 1rem;">
        <!-- Dynamically rendered edit cards -->
      </div>

      <button id="btn-add-sublist" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;">
        + Add New Sub List
      </button>

      <!-- Edit Footer Controls -->
      <div class="edit-footer-actions">
        <button id="btn-discard-edit" class="btn btn-secondary">Discard Changes</button>
        <button id="btn-save-edit" class="btn btn-primary">Save All Changes</button>
      </div>
    </section>
  </div>

  <!-- ==========================================================================
       Confirmation Modal
       ========================================================================== -->
  <div id="modal-confirm" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modal-confirm-title" class="modal-title">Confirm Action</h3>
      <div class="modal-body">
        <p id="modal-confirm-msg">Are you sure you want to proceed?</p>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-modal-confirm-action" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Application Scripts -->
  <script src="js/cruising-boat-data.js"></script>
  <script src="js/pegasus-boat-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/bluetooth-share.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
